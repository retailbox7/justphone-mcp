[project]
name = "justphone-mcp"
version = "0.2.0"
description = "Phone book MCP server for JustPhone — voice-controlled telephony"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.14.0,<3",
    "mysql-connector-python>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
